<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Match search</title>
    <script src="./info.js"></script>
</head>
<body>
    <!-- 타이틀과 검색창 영역 -->
    <div style="margin-top:30px; display:flex; flex-direction: column; align-items: center;">
        <div style="color: black; font-size: 40px; font-family: Inter; font-weight: 400; word-wrap: break-word">소환사명을 입력해주세요</div>
        <div style="margin-top:30px; display:flex; flex-direction: row;">
            <input id="summonerName" style="width:500px; height:30px; font-size: 30px;"/>
            <button onclick="moveSearchPage()">검색</button>
        </div>

        <!-- 프로필아이콘과 소환사정보 출력영역 -->
        <div style="margin-top:30px; display:flex; align-items: center; justify-content: center;">
            <div style="position: relative; width:100px; height:100px; border: 1px dotted #bcbcbc;">
                <img id="profileIcon" style="width:100px; height:100px;"/>
                <div style="position: absolute; bottom: 0px; left: 50%; transform: translate(-50%,0%); width:50px; height:20px; border: 1px dotted #bcbcbc; background-color: black;">
                    <div style="display:flex; align-items: center; justify-content: center; color: black; font-size: 20px; font-family: Inter; font-weight: 400; word-wrap: break-word">
                        <div id="summonerLevel" style="color: white; font-size: 15px; font-family: Inter; font-weight: 400; word-wrap: break-word">
                        </div>
                    </div>
                </div>
            </div>
            <div style="padding: 10px; width:500px; height:100px; border: 1px dotted #bcbcbc;">
                <div id="summonerProfileName" style="color: black; font-size: 30px; font-family: Inter; font-weight: 400; word-wrap: break-word"></div>
                <div id="summonerTier" style="margin-top: 5px; color: black; font-size: 20px; font-family: Inter; font-weight: 400; word-wrap: break-word"></div>
            </div>
        </div>

        <!-- 매치리스트 출력 영역 -->
        <div id="matchList" style="margin-top:10px; display:flex; align-items: center; justify-content: center; border: 1px dotted #bcbcbc;"></div>

        <!-- 승리예측 영역 -->
        <div id="winPredict" style="margin-top:20px; display:flex; align-items: center; justify-content: center; border: 1px dotted #bcbcbc;">승리예측</div>
        <!-- 게임 세부정보 영역 -->
        <div style="margin-top:20px; display:flex; align-items: center; justify-content: center; border: 1px dotted #bcbcbc;">
            <div id="rune" style="width: 300px; height: 500px; background-color: aqua;">
                룬 영역
            </div>
            <div id="skill" style="width: 300px; height: 500px; background-color: rebeccapurple;">
                스킬영역
            </div>
        </div>
        <div id="item" style="width: 600px; height: 50px; display:flex; align-items: center; justify-content: center; border: 1px dotted #bcbcbc;">아이템 영역</div>
    </div>
</body>
</html>
